<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>博客Blog - 缎金SatinAu</title>
  <meta name="application-name" content="缎金SatinAuの小站">
  <meta property="og:site_name" content="缎金SatinAuの小站">
  <meta name="description" content="缎金SatinAu的个人博客，大概就是分享一些科技和Furry文章">
  <meta name="keywords" content="缎金,SatinAu,博客,Blog,文章">
  <meta name="author" content="缎金SatinAu">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <link rel="canonical" href="https://satinau.cn/blog">
  <link rel="icon" type="image/x-icon" href="https://satinau.cn/favicon.ico">
  <link rel="stylesheet" href="src/style.css">
  <script src="src/script/config.js"></script>
  <script src="src/script/common.js" defer></script>
  <script src="src/script/pages/blog.js" defer></script>
  <script src="src/script/components/comment.js" defer></script>
  <script src="src/script/components/CRCMenu.js"></script>
  <script src="src/script/components/GlobalModal.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.1.0/lib/marked.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.15.2/viewer.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.15.2/viewer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>
<body id="blog-page">
  <div class="color-bg color-bg-1"></div>
  <div class="color-bg color-bg-2"></div>
  <div class="color-bg color-bg-3"></div>
  <div class="color-bg color-bg-4"></div>
  <main class="page">
    <header>
      <div class="title-row">
        <h1>博客 Blog</h1>
      </div>
      <div class="greeting" id="greeting"></div>
    </header>

    <section>
      <div id="momentsCard" class="contact-wrapper" style="margin-bottom: 24px; grid-template-columns: 1fr;">
        <a href="pages/moments.html" class="contact-card">
          <div class="icon" style="background: linear-gradient(135deg, #FF9999, #fad0c4);">
            <span style="font-size: 20px;">📸</span>
          </div>
          
          <div class="text">
            <div class="label">动态</div>
            <div class="value">聊点日常和生活碎片</div>
          </div>
          
          <svg viewBox="0 0 24 24" width="24" height="24" style="margin-left: auto; opacity: 0.6; fill: currentColor;">
            <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
          </svg>
        </a>
      </div>

      <div class="search-container">
        <div class="search-box-row">
          <div class="search-wrapper">
            <input type="text" id="blogSearchInput" placeholder="搜索文章..." autocomplete="off">
            <svg class="search-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <button id="searchClearBtn" class="search-clear-btn" type="button" aria-label="清空搜索" style="display: none;">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <button id="searchCancelBtn" class="search-cancel-btn" type="button">取消</button>
        </div>

        <div id="searchHistoryContainer" class="search-history-container" style="display: none;">
          <div class="search-history-header">
            <span class="search-history-title">
              <svg class="history-clock-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              搜索历史
            </span>
            <button type="button" id="clearHistoryBtn" class="search-history-clear-btn" style="display: none;">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
              清空
            </button>
          </div>
          <div id="searchHistoryList" class="search-history-list"></div>
        </div>

        <div class="search-actions" id="searchActions" style="display: none;">
          <button type="button" id="deepSearchToggle" class="deep-search-btn" aria-pressed="false" title="开启后将搜索全部文章的正文内容">
            <svg class="deep-search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              <line x1="8" y1="11" x2="14" y2="11"/>
              <line x1="11" y1="8" x2="11" y2="14"/>
            </svg>
            <span class="deep-search-label">开启深度搜索</span>
          </button>
          <div id="searchStats" class="search-stats"></div>
        </div>
      </div>

      <div id="blogList" class="contact-wrapper"></div>
      <div id="searchEmptyState" class="search-empty-state" style="display: none;">
        <p id="searchEmptyMsg" class="search-empty-msg">未找到相关文章</p>
        <button id="searchEmptyDeepBtn" class="deep-search-btn" type="button" style="display: none; margin: 0 auto;">
          <svg class="deep-search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            <line x1="8" y1="11" x2="14" y2="11"/>
            <line x1="11" y1="8" x2="11" y2="14"/>
          </svg>
          开启深度搜索
        </button>
      </div>
      <div id="emptyState" style="display: none; text-align: center; padding: 40px 20px;">
        <p>没有找到文章，请稍后再试</p>
      </div>
      <div id="errorState" style="display: none; text-align: center; padding: 40px 20px;">
        <p>加载失败，请刷新页面重试</p>
        <button id="retryBtn" class="back-button" style="margin-top: 15px;">
          <svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 013.51 15"/></svg>
        </button>
      </div>
      
      <article id="postView" class="md-article" style="display:none;">
        <div class="post-meta">
          <button id="backToList" class="back-button" aria-label="返回">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <h2 id="postTitle"></h2>
          <p id="postDate" class="post-date"></p>
        </div>
        <div id="postContent" class="md-body"></div>
        <div class="post-actions-panel">
          <!-- 文章列表按钮 -->
          <div class="action-item">
            <button id="backToListBtn" class="action-btn" aria-label="文章列表">
              <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <span class="action-label">文章列表</span>
          </div>

          <!-- 回到顶部按钮 -->
          <div class="action-item">
            <button id="backToTopBtn" class="action-btn" aria-label="回到顶部">
              <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <span class="action-label">回到顶部</span>
          </div>

          <div class="action-item">
            <button id="shareArticleBtn" class="action-btn" aria-label="分享文章">
              <svg viewBox="0 0 24 24">
                <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z" fill="currentColor"/>
              </svg>
            </button>
            <span class="action-label">分享</span>
          </div>
        </div>
        <div id="postError" style="display: none; text-align: center; padding: 40px 20px;">
          <p>文章加载失败</p>
          <button class="retryPost back-button" style="margin-top: 15px;">
            <svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 013.51 15"/></svg>
          </button>
        </div>
      </article>
    </section>

    <script src="src/script/components/footer.js"></script>
    <site-footer></site-footer>
  </main>

  <!-- 加载动画 -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- 弹窗组件 -->
  <global-modal id="globalModal"></global-modal>

  <!-- 导航栏 -->
  <script src="src/script/components/navigate.js"></script>
  <navigate-bar></navigate-bar>
</body>

</html>
