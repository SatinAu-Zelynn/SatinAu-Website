<body id="network-help-page">
  <!-- 背景色块 -->
  <div class="color-bg color-bg-1"></div>
  <div class="color-bg color-bg-2"></div>
  <div class="color-bg color-bg-3"></div>
  <div class="color-bg color-bg-4"></div>

  <main class="page container">
    <header style="padding-top: 60px; padding-bottom: 20px;">
      <!-- 返回按钮 -->
      <a onclick="window.close()" class="back-button" aria-label="关闭页面">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </a>
      <div class="title-row" style="justify-content: center; display: flex;">
        <h1>网络资源加载说明</h1>
      </div>
    </header>

    <section>
      <div class="ai-summary-card" style="margin-top: 0; text-align: left;">
        <div class="ai-header">
          <span class="ai-icon">🚀</span>
          <span>加速与故障排查</span>
        </div>
        <div class="ai-content">
          <p>如果您在浏览本站时遇到以下问题，通常是因为当前网络环境连接默认的 CDN 节点不畅导致的：</p>
          
          <ul style="margin: 10px 0 15px 20px; padding: 0; font-size: 14px; line-height: 1.6; color: var(--word-color);">
            <li>图片加载极其缓慢或无法显示（显示裂图图标）。</li>
            <li>博客文章或列表数据无法刷新。</li>
            <li>动态、关于我、友情链接和歌单分享页面无法加载。</li>
          </ul>

          <!-- 解决方案提示块 -->
          <div style="background: rgba(var(--primary-rgb), 0.08); padding: 16px; border-radius: 12px; border: 1px solid rgba(var(--primary-rgb), 0.15); margin-top: 20px;">
            <p style="margin: 0 0 10px 0; font-size: 15px; font-weight: 600;">
              💡 解决方案：切换 CDN 线路
            </p>
            <p style="margin: 0 0 15px 0; font-size: 14px; opacity: 0.9;">
              请前往网站设置，找到 <strong>“静态资源线路”</strong> 选项进行切换。切换后系统会自动刷新页面以应用新线路。
            </p>
            
            <div style="text-align: center;">
                <a href="javascript:void(0);" onclick="if (typeof window.openSettingsModal === 'function') { window.openSettingsModal('route-switching', this); } else { document.querySelector('global-modal')?.showSettings('route-switching'); } return false;" class="ai-generate-btn" style="text-decoration: none; cursor: pointer;">
                前往设置
                </a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 页脚 -->
    <script src="/src/script/components/footer.js"></script>
    <site-footer></site-footer>
  </main>

  <!-- Toast -->
  <div id="toast" class="toast"></div>
  <!-- 弹窗组件 -->
  <global-modal id="globalModal"></global-modal>

</body>
