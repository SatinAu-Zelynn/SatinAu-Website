<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>友情链接 - 缎金SatinAu</title>
  <meta name="author" content="缎金SatinAu">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <link rel="icon" type="image/x-icon" href="https://satinau.cn/favicon.ico">
  <link rel="stylesheet" href="/src/style.css">
  <script src="/src/script/config.js"></script>
  <script src="/src/script/common.js" defer></script>
  <script src="/src/script/pages/friendlink.js" defer></script>
  <script src="/src/script/components/comment.js" defer></script>
  <script src="/src/script/components/CRCMenu.js"></script>
  <script src="/src/script/components/GlobalModal.js" defer></script>

<body id="friendlink-page">
  <div class="color-bg color-bg-1"></div>
  <div class="color-bg color-bg-2"></div>
  <div class="color-bg color-bg-3"></div>
  <div class="color-bg color-bg-4"></div>

  <main class="page">
    <header>
      <div class="title-row">
        <h1>友情链接</h1>
      </div>
      <div class="greeting" id="greeting"></div>
    </header>

    <section>
      <pre style="
        background: light-dark(rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.1));
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid light-dark(rgba(255, 255, 255, 0.25), rgba(255,255,255,0.12));
        border-radius: var(--border-radius-lg);
        box-shadow: 0 12px 32px rgba(0,0,0,0.12), inset 0 0 20px rgba(255,255,255,0.08);
        padding: 2rem;
        overflow-x: auto;
      "><code style="font-family: 'Google Sans Code', 'Google Sans Flex', MiSans, sans-serif;"
      >name: 缎金SatinAuの主页
link: https://satinau.cn
desc: 一只雪狐的摸鱼小站
avatar: https://satinau.cn/favicon.ico</code></pre>
    </section>
    
    <section>
      <h2>随机友链</h2>
      <div class="contact-wrapper">
        <a class="contact-card" href="javascript:void(0);" onclick="document.getElementById('globalModal').with(this).alert('是否跳转到 随机友链（开往）？','https://www.travellings.cn/go.html')">
          <div class="icon">
            <span style="font-size: 28px;">🚇</span>
          </div>
          <div class="text">
            <div class="label">开往</div>
            <div class="value">Travelling</div>
          </div>
        </a>
        <a class="contact-card" href="javascript:void(0);" onclick="document.getElementById('globalModal').with(this).alert('是否跳转到 随机友链（十年之约）？','https://www.foreverblog.cn/go.html')">
          <div class="icon">
            <img src="https://www.foreverblog.cn/favicon.ico" alt="ForeverBlog">
          </div>
          <div class="text">
            <div class="label">十年之约</div>
            <div class="value">Forever Blog</div>
          </div>
        </a>
      </div>
    </section>

    <section>
      <h2>我的伙伴</h2>
      <div id="friendlink-container" class="content-grid">
        <!-- JS 自动注入卡片 -->
      </div>
    </section>

    <section style="text-align: left;">
      <div id="friendlink-comments"></div>
    </section>

    <script src="/src/script/components/footer.js"></script>
    <site-footer></site-footer>
    
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        if (typeof initFriendLinks === "function") {
        initFriendLinks();
        initPageComments('friendlink-comments', 'friendlink');
        }
    });
    </script>
  </main>

  <!-- 加载动画 -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- 弹窗组件 -->
  <global-modal id="globalModal"></global-modal>

  <!-- 导航栏 -->
  <script src="/src/script/components/navigate.js"></script>
  <navigate-bar></navigate-bar>
</body>
